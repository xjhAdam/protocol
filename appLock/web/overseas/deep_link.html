<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open AppLock</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      color: #fff;
    }

    .card {
      width: 88%;
      max-width: 360px;
      padding: 36px 28px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    h3 {
      margin: 12px 0 26px;
      font-size: 22px;   /* 👈 放大 */
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn {
      display: inline-block;
      width: 100%;        /* 👈 关键：满宽按钮 */
      padding: 16px 0;    /* 👈 更高点击区域 */
      font-size: 18px;    /* 👈 放大字体 */
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      border: none;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(59,130,246,0.45);
      transition: transform 0.1s ease;
      display: block;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .hint {
      margin-top: 16px;
      font-size: 14px;  /* 👈 放大一点 */
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <div class="card">

    <img class="logo" src="../../images/logo.png" />

    <h3>Open AppLock</h3>

    <a class="btn" href="applock://open/unlock?mode=web" onclick="openApp(event)">
      Open App
    </a>

    <div class="hint">Tap to continue to App</div>

  </div>

</body>

<script>

function openApp(e) {

  setTimeout(() => {

    document.body.innerHTML = `

      <div style="display:flex;justify-content:center;align-items:center;font-family:sans-serif;color:#fff;">

        Done

      </div>

    `;

  }, 300);

}

</script>

</html>
