<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Open AppLock</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      color: #fff;
    }

    .card {
      width: 280px;
      padding: 28px 24px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    h3 {
      margin: 10px 0 20px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(59,130,246,0.4);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>

</head>

<body>

  <div class="card">

    <img class="logo" src="../../images/logo.png" />

    <h3>Open AppLock</h3>

    <a class="btn" href="applock://open/unlock?mode=web">
      Open App
    </a>

    <div class="hint">Tap to continue to App</div>

  </div>

</body>
</html>
